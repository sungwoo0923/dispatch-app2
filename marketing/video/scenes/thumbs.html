<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>썸네일</title><link rel="stylesheet" href="../base.css">
<style>body{width:1280px;height:720px}
.t{position:absolute;left:70px;top:150px;font-size:96px;font-weight:900;line-height:1.12;text-shadow:0 8px 30px #000}
.k{position:absolute;left:74px;top:80px;font-size:30px}
.shot{position:absolute;right:-80px;top:300px;width:740px;transform:rotate(-4deg)}

<div class="grid"></div><div class="glow" style="width:700px;height:600px;left:600px;top:60px;opacity:.5"></div>
<div class="browser shot"><div class="bar"><i></i><i></i><i></i><b id="lab"></b></div><img id="img"></div>
<span class="chip k" id="k"></span><div class="t" id="t"></div>
<div class="logo"><img src="../../../landing-site/brand/logisweb-mark.svg"><b class="logo-w">Logis<span>Web</span></b></div>
<script>const c=JSON.parse(decodeURIComponent(location.hash.slice(1)));
k.textContent=c.k;t.innerHTML=c.t;img.src="../../../landing-site/img/"+c.img;lab.textContent=c.lab;</script>
</body></html>
