<html><head><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet"><style>body{margin:0;background:#F4F6FA;font-family:'Noto Sans KR';padding:46px;width:2300px;box-sizing:border-box;color:#0F1A30}
h1{font-size:40px;margin:0 0 6px;font-weight:900}p.s{margin:0 0 28px;font-size:21px;color:#55657F}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.c{background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 34px rgba(15,26,48,.06)}.c img.b{width:100%;display:block}.t{font-size:22px;font-weight:900;margin-top:12px}.k{display:inline-block;font-size:14px;color:#fff;background:#0F1A30;border-radius:7px;padding:1px 8px;margin-right:8px;vertical-align:3px}
.d{font-size:15.5px;color:#55657F;line-height:1.5;margin-top:5px;min-height:70px}.sm{display:flex;gap:10px;align-items:flex-end;margin-top:8px}
.lk{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 16px;margin-top:12px}.wm{font-size:19px;font-weight:900;letter-spacing:.02em}</style></head><body>
<h1>로지스웹 허브 로고 — 완전히 새 방향</h1><p class="s">빛 · 지구 없이, 평면 · 굵은 선 · 단순한 브랜드 마크 (토스 · 스트라이프 · 항공사 로고처럼) — 네이비 · 하늘색 · 금색 한 점</p><div class="g" id="g"></div>
<script>const O=[["S1","S1_spokes","허브 & 스포크","네 방향 화살표가 가운데 금색 허브로 모여요. '전국에서 허브로' 가장 직관적."],
["S2","S2_lh_ribbon","LH 리본","굵은 노선 한 줄이 L과 H(로지스 허브)를 그리고, 끝에 금색 거점. 글자 로고처럼 기억에 남아요."],
["S3","S3_dot_matrix","도트 매트릭스","점 판 위 몇 점이 이어져 위로 오르는 노선이 돼요. 디지털 · 데이터 · 성장."],
["S4","S4_honeycomb","벌집 허브","가운데 금색 육각형(허브)을 여섯 운송사가 둘러싸요. '함께 모이는 곳'."],
["S5","S5_cycle","순환 화살표","세 화살표가 돌며 오더를 주고받아요. 흰 바탕에서 깔끔한 기업 로고."],
["S6","S6_pin_box","핀 + 박스","위치 핀 안에 화물 박스. '어디서든 화물을' — 물류 서비스가 바로 읽혀요."],
["S7","S7_link","연결 고리","두 고리가 맞물려요 — 운송사와 운송사의 연결. 부드럽고 친근해요."],
["S8","S8_h_letter","h 글자 마크","소문자 h의 줄기는 도로, 어깨는 노선, 위의 금색 점은 거점. 앱 아이콘으로 가장 단순 · 강렬."]];
document.getElementById("g").innerHTML=O.map(([k,f,t,d])=>`<div class="c"><img class="b" src="${f}.svg"><div class="t"><span class="k">${k}</span>${t}</div><div class="d">${d}</div><div class="sm"><img src="${f}.svg" width="64"><img src="${f}.svg" width="40"><img src="${f}.svg" width="22"></div>
<div class="lk" style="background:#0F1A30"><img src="${f}.svg" width="46"><div><span class="wm" style="color:#fff">로지스웹 허브</span></div></div><div class="lk" style="background:#F4F6FA"><img src="${f}.svg" width="46"><div><span class="wm">로지스웹 허브</span></div></div></div>`).join("");</script></body></html>
