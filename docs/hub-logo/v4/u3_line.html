<html><head><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet"><style>body{margin:0;background:#F4F6FA;font-family:'Noto Sans KR';padding:46px;width:2300px;box-sizing:border-box;color:#0F1A30}
h1{font-size:40px;margin:0 0 6px;font-weight:900}p.s{margin:0 0 28px;font-size:21px;color:#55657F}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}
.c{background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 34px rgba(15,26,48,.06)}.c img.b{width:100%;display:block}.t{font-size:21px;font-weight:900;margin-top:12px}.d{font-size:15px;color:#55657F;line-height:1.5;margin-top:5px;min-height:66px}
.sm{display:flex;gap:10px;align-items:flex-end;margin-top:8px}.lk{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 16px;margin-top:12px}.wm{font-size:20px;font-weight:900}.en{font-size:12px;font-weight:800;letter-spacing:.14em;opacity:.6}</style></head><body>
<h1>U3 hub 글자 로고 — 일자 선 + 약한 그라데이션</h1><p class="s">꺾지 않고 곧은 한 줄 — 왼쪽은 옅게 시작해 오른쪽 금색 점으로 갈수록 또렷하게</p><div class="g" id="g"></div>
<script>const O=[["../../../public/brand/logisweb-mark-square.svg","(참고) 로지스웹 마크","금색 노선 · 빛나는 점"],
["U3e_line_gold.svg","E 금색 일자","가는 금색 한 줄 — 왼쪽은 옅게, 오른쪽 금색 점으로 또렷하게. 가장 단정해요."],
["U3f_line_sky_gold.svg","F 하늘색 → 금색","조금 더 굵은 선이 하늘색에서 금색으로 바뀌어요. 움직임 · 방향감이 살짝 더 있어요."],
["U3g_line_light.svg","G 밝은 바탕","E와 같은 선, 네이비 글자 · 진한 금색. 흰 화면 · 인쇄용."],
["U3a_route_v.svg","(이전) A 꺾인 선","비교용"]];
document.getElementById("g").innerHTML=O.map(([f,t,d])=>`<div class="c"><img class="b" src="${f}"><div class="t">${t}</div><div class="d">${d}</div><div class="sm"><img src="${f}" width="80"><img src="${f}" width="48"><img src="${f}" width="28"></div>
<div class="lk" style="background:#0F1A30"><img src="${f}" width="50"><div><div class="wm" style="color:#fff">로지스웹 허브</div><div class="en" style="color:#fff">LOGISWEB HUB</div></div></div></div>`).join("");</script></body></html>
