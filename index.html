<!doctype html>

    <script>
      (function() {
        // iOS Safari: gesture events
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

        // Android Chrome: pinch-zoom via touchmove (Chrome 65+ ignores user-scalable=no)
        document.addEventListener('touchmove', function(e) {
          if (e.touches.length > 1) { e.preventDefault(); }
        }, { passive: false });

        // Android Chrome: track pinch scale via touchstart
        var lastScale = 1;
        document.addEventListener('touchstart', function(e) {
          if (e.touches.length > 1) { e.preventDefault(); }
        }, { passive: false });

        // Double-tap zoom prevention
        var lastTouch = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouch < 300) { e.preventDefault(); }
          lastTouch = now;
        }, { passive: false });

        // Force zoom = 1.0 permanently (overrides Chrome browser-level zoom / foldable screen switch)
        // ⚠️ 일부 폴더블 기기(갤럭시Z폴드 등)에서 스크롤하는 동안 visualViewport의
        // resize 이벤트가 실제 확대/축소 없이도 계속 발생하고, 그때마다 scale 값이
        // 순간적으로 0.95~1.05 범위를 살짝 벗어나 보고되는 경우가 있었다. 이 아래
        // forceResetZoom은 그때마다 뷰포트 meta를 지웠다가 다시 쓰는 "토글" 방식으로
        // 강제 리플로우를 일으키는데, 스크롤 중 반복 호출되면 그 자체가 레이아웃을
        // 계속 다시 그리게 만들어 화면이 떨리며 스크롤이 계속 맨 위로 튕겨나가는
        // 증상의 원인이 됐다. (1) 리셋 자체에 짧은 쿨다운을 둬 연속 호출을 막고,
        // (2) visualViewport resize는 즉시 반응하지 않고 살짝 디바운스해서, 진짜
        // 핀치줌처럼 값이 안정적으로 유지될 때만 반응하도록 방어한다.
        var lastZoomReset = 0;
        function forceResetZoom() {
          var meta = document.querySelector('meta[name=viewport]');
          if (!meta) return;
          var now = Date.now();
          if (now - lastZoomReset < 400) return; // 최근에 이미 리셋했으면 중복 실행하지 않음
          lastZoomReset = now;
          // Toggle trick: remove then re-add to force Chrome to re-evaluate at scale 1
          meta.content = 'width=device-width, initial-scale=1.0';
          // Use rAF so browser processes the above before we lock it down
          requestAnimationFrame(function() {
            meta.content = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
          });
        }
        forceResetZoom();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', forceResetZoom);
        }
        window.addEventListener('load', forceResetZoom);
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') { forceResetZoom(); }
        });
        // visualViewport API: detect any browser-level zoom and snap back
        if (window.visualViewport) {
          var zoomCheckTimer = null;
          window.visualViewport.addEventListener('resize', function() {
            clearTimeout(zoomCheckTimer);
            zoomCheckTimer = setTimeout(function() {
              var scale = window.visualViewport.scale;
              if (scale < 0.95 || scale > 1.05) { forceResetZoom(); }
            }, 150);
          });
        }
      })();
    </script>

      <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"

      #kp-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;

      #kp-boot svg { position: relative; filter: drop-shadow(0 14px 30px rgba(0,0,0,0.45)); animation: kpbIn .45s cubic-bezier(.2,.9,.3,1.1) both; }
      #kp-boot .t1 { position: relative; margin-top: 22px; color: #fff; font: 900 22px 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace; letter-spacing: .32em; padding-left: .32em; }
      #kp-boot .t2 { position: relative; margin-top: 6px; color: rgba(207,224,255,.45); font: 700 10.5px Pretendard, 'Noto Sans KR', sans-serif; letter-spacing: .3em; padding-left: .3em; }
      #kp-boot .bar { position: relative; margin-top: 28px; width: 120px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
      #kp-boot .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #CFE0FF, transparent); animation: kpbBar 1.1s ease-in-out infinite; }
      @keyframes kpbIn { from { opacity: 0; transform: scale(.86) } to { opacity: 1; transform: none } }
      @keyframes kpbBar { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
