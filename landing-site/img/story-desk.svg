<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="t d">
  <title id="t">LogisWeb을 만들기 전, 배차 실무자의 하루</title>
  <desc id="d">엑셀 배차일지에 오더를 한 줄씩 입력하고, 중복 배차와 빠진 오더를 확인하고, 문자로 받은 인수증을 업체에 다시 보내고, 기사에게 위치를 전화로 묻는 장면</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13213D"/><stop offset="1" stop-color="#0B1428"/></linearGradient>
    <linearGradient id="ph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2B4B"/><stop offset="1" stop-color="#0F1A30"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-rendering:geometricPrecision}
      .m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="640" height="540" rx="28" fill="url(#bg)"/>
  <circle cx="560" cy="60" r="150" fill="#4F8BFF" opacity=".08"/>

  <!-- 시계 · 위치 확인 전화 -->
  <rect x="20" y="18" width="178" height="40" rx="20" fill="#0B1428" stroke="#2D4C82" stroke-width="1.5"/>
  <circle cx="44" cy="38" r="9" fill="none" stroke="#8FB0F0" stroke-width="2.2"/>
  <path d="M44 32v6l4 2.5" stroke="#8FB0F0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="62" y="44" font-size="16" font-weight="800" fill="#fff" class="m">23:40</text>
  <text x="122" y="44" font-size="15" font-weight="700" fill="#A9C0EC">또 야근</text>

  <rect x="410" y="18" width="210" height="40" rx="20" fill="#22375F" stroke="#2D4C82" stroke-width="1.5"/>
  <path d="M432 30c2 7 6 11 13 13l3-3c1-1 2-1 3 0l3 2c1 1 1 2 0 3l-2 2c-2 2-6 2-10 0-6-3-10-7-13-13-2-4-2-8 0-10l2-2c1-1 2-1 3 0l2 3c1 1 1 2 0 3z" fill="#fff"/>
  <text x="462" y="44" font-size="15.5" font-weight="800" fill="#fff">위치 확인 전화 12통</text>

  <!-- 엑셀 배차일지 -->
  <g filter="url(#sh)">
    <rect x="20" y="76" width="392" height="360" rx="14" fill="#F4F7FC"/>
  </g>
  <path d="M20 90a14 14 0 0 1 14-14h364a14 14 0 0 1 14 14v30H20z" fill="#1B2B4B"/>
  <circle cx="42" cy="98" r="5" fill="#fff" opacity=".5"/><circle cx="58" cy="98" r="5" fill="#fff" opacity=".5"/><circle cx="74" cy="98" r="5" fill="#fff" opacity=".5"/>
  <text x="92" y="104" font-size="15" font-weight="800" fill="#fff">배차일지_11월_최종.xlsx</text>

  <rect x="32" y="132" width="368" height="32" rx="5" fill="#DCE5F2"/>
  <g font-size="14" font-weight="800" fill="#1B2B4B">
    <text x="44" y="153">상차지</text><text x="134" y="153">하차지</text><text x="224" y="153">기사</text><text x="300" y="153">배차</text>
  </g>
  <g font-size="15" font-weight="600" fill="#22314F">
    <rect x="32" y="168" width="368" height="40" fill="#fff"/>
    <text x="44" y="194">평택 물류</text><text x="134" y="194">부산 신항</text><text x="224" y="194">김기사</text><text x="300" y="194" font-weight="800" fill="#2D4C82">완료</text>

    <rect x="32" y="210" width="368" height="40" fill="#E3ECFB"/><rect x="32" y="210" width="4" height="40" fill="#2D5BD8"/>
    <text x="44" y="236">이천 센터</text><text x="134" y="236">대구 성서</text><text x="224" y="236">박기사</text>
    <rect x="296" y="220" width="74" height="22" rx="6" fill="#2D5BD8"/><text x="333" y="236" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">중복 배차</text>

    <rect x="32" y="252" width="368" height="40" fill="#E3ECFB"/><rect x="32" y="252" width="4" height="40" fill="#2D5BD8"/>
    <text x="44" y="278">이천 센터</text><text x="134" y="278">대구 성서</text><text x="224" y="278">이기사</text>
    <rect x="296" y="262" width="74" height="22" rx="6" fill="#2D5BD8"/><text x="333" y="278" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">중복 배차</text>

    <rect x="32" y="294" width="368" height="40" fill="#fff"/>
    <text x="44" y="320">안산 공장</text><text x="134" y="320">광주 하남</text><text x="224" y="320" fill="#9AA9C3">-</text>
    <rect x="296" y="304" width="54" height="22" rx="6" fill="#DCE5F2"/><text x="323" y="320" font-size="13.5" font-weight="800" fill="#2D4C82" text-anchor="middle">???</text>

    <rect x="32" y="336" width="368" height="40" fill="#fff"/>
    <text x="44" y="362">평택 물류</text><text x="134" y="362">부산 신</text>
    <rect x="191" y="347" width="2" height="20" fill="#2D5BD8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <text x="44" y="412" font-size="14" font-weight="700" fill="#5B6B85">어제와 같은 오더도 오늘 또 한 글자씩…</text>

  <!-- 휴대폰: 인수증 · 위치 문자 -->
  <g filter="url(#sh)">
    <rect x="428" y="76" width="192" height="360" rx="28" fill="url(#ph)" stroke="#2D4C82" stroke-width="2"/>
  </g>
  <rect x="496" y="88" width="56" height="7" rx="3.5" fill="#0B1428"/>
  <text x="446" y="124" font-size="14" font-weight="800" fill="#A9C0EC">문자 · 박기사</text>
  <rect x="442" y="136" width="130" height="92" rx="14" fill="#22375F"/>
  <rect x="452" y="146" width="110" height="50" rx="7" fill="#D3DFF5"/>
  <path d="M456 192l22-20 14 12 12-9 22 17z" fill="#8FB0F0"/>
  <text x="452" y="217" font-size="13.5" font-weight="700" fill="#D3DFF5">인수증 사진</text>
  <rect x="460" y="240" width="148" height="40" rx="14" fill="#2D5BD8"/>
  <text x="474" y="265" font-size="14.5" font-weight="700" fill="#fff">업체에 다시 보내기</text>
  <rect x="442" y="292" width="140" height="40" rx="14" fill="#22375F"/>
  <text x="456" y="317" font-size="14.5" font-weight="700" fill="#D3DFF5">한 장 더 보내요</text>
  <rect x="468" y="344" width="140" height="40" rx="14" fill="#2D5BD8"/>
  <text x="482" y="369" font-size="14.5" font-weight="700" fill="#fff">기사님 어디세요?</text>
  <rect x="442" y="396" width="164" height="28" rx="14" fill="#0B1428" stroke="#2D4C82"/>
  <text x="458" y="415" font-size="12.5" fill="#8FB0F0">메시지 입력</text>

  <!-- 메모 -->
  <g filter="url(#sh)">
    <rect x="20" y="456" width="192" height="64" rx="12" fill="#22375F" stroke="#2D4C82" stroke-width="1.5"/>
    <rect x="224" y="456" width="192" height="64" rx="12" fill="#22375F" stroke="#2D4C82" stroke-width="1.5"/>
    <rect x="428" y="456" width="192" height="64" rx="12" fill="#22375F" stroke="#2D4C82" stroke-width="1.5"/>
  </g>
  <text x="36" y="484" font-size="16" font-weight="800" fill="#fff">마감 엑셀 또 만들기</text>
  <text x="36" y="506" font-size="13.5" font-weight="600" fill="#A9C0EC">월말마다 거래처별로 따로</text>
  <text x="240" y="484" font-size="16" font-weight="800" fill="#fff">빠진 오더 없나?</text>
  <text x="240" y="506" font-size="13.5" font-weight="600" fill="#A9C0EC">카톡방 다시 훑어보기</text>
  <text x="444" y="484" font-size="16" font-weight="800" fill="#fff">이번 달 매출은?</text>
  <text x="444" y="506" font-size="13.5" font-weight="600" fill="#A9C0EC">장부를 합쳐 봐야 앎</text>
</svg>
