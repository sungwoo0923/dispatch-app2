name: 버전 올리기

# 🔖 2026-11-23 사용자 요청 — "업데이트하면 버전은 항상 올라가야 한다"(1.3.716 에서 멈춰 있었다)
#  예전엔 개인 컴퓨터의 git push 훅(.husky/pre-push)이 있을 때만 끝자리를 올렸다.
#  GitHub 화면에서 합치거나(PR 병합) 훅이 없는 곳에서 올리면 버전이 그대로였다.
#  → main 에 무엇이 올라오든 GitHub 이 끝자리를 1 올린 "chore: version" 커밋을 하나 더 만든다.
#  · 이번 push 에서 이미 버전이 올라갔으면(훅이 올린 경우) 건너뛴다 — 두 번 오르지 않게
#  · 버전 커밋이 다시 이 작업을 부르지 않는다(GITHUB_TOKEN 으로 올린 커밋은 다른 작업을 깨우지 않음)
#  · Vercel 은 버전 커밋도 배포하므로 화면에 보이는 버전 = 올라간 번호

on:
  push:
    branches: [main]

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: version')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 이번 push 에서 버전이 이미 올라갔는지
        id: chk
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          NOW=$(node -p "require('./package.json').version")
          PREV=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            PREV=$(git show "$BEFORE:package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")
          fi
          echo "지금 $NOW · 이전 $PREV"
          if [ -n "$PREV" ] && [ "$NOW" != "$PREV" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

      - name: 끝자리 1 올려서 커밋
        if: steps.chk.outputs.skip == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main
            V=$(node -e "
              const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));
              const a=p.version.split('.').map(Number);a[2]++;p.version=a.join('.');
              fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');process.stdout.write(p.version);")
            git add package.json
            git commit -m "chore: version $V" --quiet
            if git push origin HEAD:main --quiet; then echo "✅ 버전 $V"; exit 0; fi
            git reset --hard origin/main --quiet
            sleep 3
          done
          echo "::error::버전 커밋을 올리지 못했습니다(main 보호 규칙을 확인하세요)"
          exit 1
