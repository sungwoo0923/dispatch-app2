# ⭐ 2026-11-06 폰에서 Firebase 배포 — GitHub 앱/웹 › Actions › "Firebase 배포" › Run workflow
# 처음 한 번: 저장소 Settings › Secrets › Actions 에 FIREBASE_SERVICE_ACCOUNT (서비스 계정 JSON 전체) 등록
name: Firebase 배포

on:
  workflow_dispatch:
    inputs:
      target:
        description: "무엇을 올릴까요?"
        type: choice
        default: "허브(규칙+색인+저장소+허브알림)"
        options:
          - "허브(규칙+색인+저장소+허브알림)"
          - "규칙+색인+저장소만"
          - "서버 기능 전체(functions)"
          - "전부(규칙+색인+저장소+functions)"
      custom:
        description: "직접 입력(채우면 위 선택 무시) 예: firestore:rules,functions:dailyReportPush"
        type: string
        required: false
        default: ""

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 서비스 계정 확인
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 비밀값이 없습니다. Settings › Secrets and variables › Actions 에 등록하세요."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 대상 정하기
        id: t
        # ⭐ 2026-11-07 보안 점검 — 입력값을 스크립트에 직접 끼워 넣지 않고 환경 변수로 받는다(명령 끼워 넣기 방지) · 대상 이름은 영문·숫자·:,_- 만
        env:
          CUSTOM: ${{ inputs.custom }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ -n "$CUSTOM" ] && ! printf '%s' "$CUSTOM" | grep -Eq '^[A-Za-z0-9:,_-]+$'; then
            echo "::error::직접 입력 대상에는 영문·숫자·콜론·쉼표·밑줄·하이픈만 쓸 수 있습니다."
            exit 1
          fi
          case "$TARGET" in
            허브*) ONLY="firestore:rules,firestore:indexes,storage,functions:hubOrderOnWrite" ;;
            규칙*) ONLY="firestore:rules,firestore:indexes,storage" ;;
            서버*) ONLY="functions" ;;
            *)     ONLY="firestore:rules,firestore:indexes,storage,functions" ;;
          esac
          if [ -n "$CUSTOM" ]; then ONLY="$CUSTOM"; fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "배포 대상: $ONLY"

      - name: functions 패키지 설치
        if: contains(steps.t.outputs.only, 'functions')
        run: npm ci --prefix functions

      # 🛠 2026-11-13 규칙(·색인·저장소)과 서버 기능을 따로 올린다
      #  규칙이 이미 최신일 때 firebase-tools 가 "Release … cloud.firestore already exists"(409)로 멈추면서
      #  뒤따르는 서버 기능까지 못 올라가던 문제 — 이 409 는 "이미 올라가 있음"이라 성공으로 보고 넘어간다
      - name: Firebase 배포 (규칙 · 색인 · 저장소)
        env:
          ONLY: ${{ steps.t.outputs.only }}
        run: |
          PART=$(printf '%s' "$ONLY" | tr ',' '\n' | grep -v '^functions' | paste -sd, - || true)
          if [ -z "$PART" ]; then echo "규칙 쪽 대상 없음 — 건너뜀"; exit 0; fi
          set +e
          npx -y firebase-tools@13 deploy --only "$PART" --project dispatch-app-9b92f --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/rules.log"
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -ne 0 ]; then
            if grep -q "HTTP Error: 409" "$RUNNER_TEMP/rules.log" && grep -q "already exists" "$RUNNER_TEMP/rules.log"; then
              echo "::warning::규칙이 이미 최신이라 다시 올리지 않았습니다(409 already exists) — 계속 진행합니다."
            else
              exit "$CODE"
            fi
          fi

      - name: Firebase 배포 (서버 기능)
        env:
          ONLY: ${{ steps.t.outputs.only }}
        run: |
          PART=$(printf '%s' "$ONLY" | tr ',' '\n' | grep '^functions' | paste -sd, - || true)
          if [ -z "$PART" ]; then echo "서버 기능 대상 없음 — 건너뜀"; exit 0; fi
          npx -y firebase-tools@13 deploy --only "$PART" --project dispatch-app-9b92f --non-interactive --force

      - name: 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
