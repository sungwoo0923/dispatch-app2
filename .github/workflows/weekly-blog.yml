# 📝 2026-11-23 매주 자동 블로그 — 월요일 아침(한국시간 07:13)마다
#  1) 이번 주 글이 없으면 marketing/blog/calendar.json 다음 주제로 Gemini가 글 + 카드 이미지 3장을 만들고
#  2) 홈페이지 블로그(landing-site/blog/) · RSS · sitemap 을 다시 만들어
#  3) "블로그:" 로 시작하는 PR 을 열어요 → 내용 확인 후 Merge 하면 홈페이지(logisweb.co.kr/blog)에 올라가요.
# 처음 한 번: 저장소 Settings › Secrets and variables › Actions › New repository secret › GEMINI_API_KEY
#            Settings › Actions › General › "Allow GitHub Actions to create and approve pull requests" 체크
# 검토 없이 바로 올리고 싶으면: Variables 탭에 BLOG_AUTO_PUBLISH = true (PR 대신 main 에 바로 올림)
name: 매주 자동 블로그

on:
  schedule:
    - cron: "13 22 * * 0" # 일요일 22:13 UTC = 월요일 07:13 KST
  workflow_dispatch:
    inputs:
      force:
        description: "이번 주 글이 있어도 하나 더 쓰기"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency: weekly-blog

jobs:
  blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 도구 설치 (Playwright · 한글 글꼴)
        run: |
          cd marketing && npm init -y >/dev/null && npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: 이번 주 글 쓰기 (Gemini)
        id: write
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node marketing/blog/scripts/weekly.mjs ${{ inputs.force && '--force' || '' }}
      - name: 카드 이미지 · 홈페이지 블로그 만들기
        run: |
          node marketing/blog/scripts/render-cards.mjs
          node marketing/blog/scripts/build.mjs
          rm -rf marketing/node_modules marketing/package.json marketing/package-lock.json
      - name: 바로 올리기 (BLOG_AUTO_PUBLISH=true 일 때)
        if: vars.BLOG_AUTO_PUBLISH == 'true'
        run: |
          git config user.name "logisweb-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/blog landing-site/blog landing-site/sitemap.xml
          git diff --cached --quiet && echo "바뀐 것 없음" && exit 0
          git commit -m "블로그: ${{ steps.write.outputs.title || '예약 글 게시' }}"
          git push origin HEAD:main
      - name: 검토용 PR 열기
        if: vars.BLOG_AUTO_PUBLISH != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: blog/weekly
          delete-branch: true
          add-paths: |
            marketing/blog
            landing-site/blog
            landing-site/sitemap.xml
          commit-message: "블로그: ${{ steps.write.outputs.title || '예약 글 게시' }}"
          title: "블로그: ${{ steps.write.outputs.title || '이번 주 예약 글 게시' }}"
          body: |
            매주 자동 블로그가 만든 글이에요. **Merge 하면 logisweb.co.kr/blog 에 올라가요.**

            - 새 글 폴더: `${{ steps.write.outputs.dir || '(이번 주는 미리 써 둔 글이 게시돼요)' }}`
            - ⚠️ 검토 필요한 표현: ${{ steps.write.outputs.bad || '없음' }}

            **확인할 것**
            1. Files changed › `post.md` 를 읽고 사실과 다른 기능 설명이 없는지 (기준: `marketing/brand/facts.md`)
            2. `card-1.png` ~ `card-3.png` 그림이 잘 나왔는지
            3. 고칠 곳은 파일 옆 연필(✏️)로 바로 고치면 돼요

            **네이버 블로그에도 올리기**: 글 폴더의 `naver.html` 을 열어 노란 상자 안내대로 붙여넣기 (5분)
