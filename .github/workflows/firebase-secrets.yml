# 🔐 2026-11-18 Firebase 비밀값 등록 — GitHub 저장소 Secrets 에 넣은 키를 Firebase(Secret Manager)에 넣고 서버를 다시 배포한다
#  쓰는 법(키를 대화창 · 코드에 적지 않는다):
#   1) 저장소 Settings › Secrets and variables › Actions › New repository secret
#        ANTHROPIC_API_KEY = Claude Console(console.anthropic.com) › API Keys 에서 만든 sk-ant-api… 키(AI 본부 · 오더 스캔 · AI 비서)
#        DATA_GO_KR_KEY    = 공공데이터포털 마이페이지 › 일반 인증키(Decoding)(기상청 날씨 · 특보 · 국세청 사업자 상태)
#   2) Actions › "Firebase 비밀값 등록" › Run workflow — 넣어 둔 것만 등록하고, 끝나면 서버 기능 전체를 다시 배포한다(새 키를 읽게)
#  키 값은 작업 기록에 나오지 않는다(GitHub 이 가린다 · 여기서도 출력하지 않는다)
name: Firebase 비밀값 등록

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "등록한 뒤 서버 기능 전체를 다시 배포할까요?(새 키는 다시 배포해야 쓰인다)"
        type: boolean
        default: true

concurrency:
  group: firebase-secrets
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 서비스 계정 확인
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 비밀값이 없습니다. Settings › Secrets and variables › Actions 에 등록하세요."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 키 등록
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set -u
          DONE=0
          BAD=0
          put() { # 이름 · 값(값은 표준입력으로만 넘긴다 — 명령줄 · 기록에 남지 않게)
            NAME="$1"; VAL="$2"
            if [ -z "$VAL" ]; then echo "· $NAME: GitHub Secrets 에 없어서 건너뜀"; return 0; fi
            VAL="$(printf '%s' "$VAL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            # ⭐ 2026-11-18 잘못된 키는 그것만 건너뛰고 나머지 키는 계속 등록한다(예전엔 여기서 멈춰 날씨 키도 못 넣었다)
            if [ "$NAME" = "ANTHROPIC_API_KEY" ] && ! printf '%s' "$VAL" | grep -q '^sk-ant-api'; then
              echo "::error::ANTHROPIC_API_KEY 가 Claude API 키(sk-ant-api…)가 아니라 등록하지 않았어요. 로그인 토큰(sk-ant-usr · sk-ant-oat)은 서버에서 쓸 수 없어요. console.anthropic.com › API Keys 에서 새로 만들어 저장소 Secrets 를 바꾼 뒤 다시 실행해 주세요."
              BAD=$((BAD + 1))
              return 0
            fi
            printf '%s' "$VAL" > "$RUNNER_TEMP/v.txt"
            set +e
            npx -y firebase-tools@13 functions:secrets:set "$NAME" --data-file="$RUNNER_TEMP/v.txt" --project dispatch-app-9b92f --non-interactive --force > "$RUNNER_TEMP/s.log" 2>&1
            CODE=$?
            set -e
            rm -f "$RUNNER_TEMP/v.txt"
            if [ "$CODE" -ne 0 ]; then
              sed 's/sk-ant-[A-Za-z0-9_-]*/sk-ant-…/g' "$RUNNER_TEMP/s.log" | tail -20
              if grep -Eqi "permission|403|denied|secretmanager" "$RUNNER_TEMP/s.log"; then
                echo "::error::서버 계정에 비밀값을 고칠 권한이 없습니다. Google Cloud 콘솔 › IAM 및 관리자 › IAM 에서 FIREBASE_SERVICE_ACCOUNT 의 계정(…@dispatch-app-9b92f.iam.gserviceaccount.com)에 '보안 비밀 관리자 관리자(Secret Manager Admin)' 역할을 추가한 뒤 다시 실행해 주세요."
              fi
              exit "$CODE"
            fi
            echo "✓ $NAME 등록(새 버전)"
            DONE=$((DONE + 1))
          }
          put ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-}"
          put DATA_GO_KR_KEY "${DATA_GO_KR_KEY:-}"
          if [ "$DONE" -eq 0 ]; then echo "::error::등록한 키가 없습니다. 저장소 Settings › Secrets and variables › Actions 에 ANTHROPIC_API_KEY 또는 DATA_GO_KR_KEY 를 먼저 넣어 주세요."; exit 1; fi
          # 하나라도 등록했으면 성공으로 두고 서버 배포를 이어서 한다(잘못된 키는 위 빨간 알림으로 남는다)
          if [ "$BAD" -gt 0 ]; then echo "::warning::키 ${DONE}개는 등록했고 ${BAD}개는 건너뛰었어요(위 알림 참고). 등록한 키로 서버를 다시 배포합니다."; fi

      - name: 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/v.txt" "$RUNNER_TEMP/s.log"

  deploy:
    needs: secrets
    if: ${{ inputs.deploy }}
    uses: ./.github/workflows/firebase-deploy.yml
    with:
      target: "서버 기능 전체(functions)"
    secrets: inherit
