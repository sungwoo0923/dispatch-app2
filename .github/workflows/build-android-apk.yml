name: Build Android APK

on:
  # ⭐ 사용자 요청 — workflow_dispatch(수동 "Run workflow" 버튼)를 이 세션에
  # 연결된 GitHub 앱이 API로 못 누른다(403, Actions 쓰기 권한 없음). main에
  # 푸시될 때마다 자동으로 빌드되게 해서, 모바일 GitHub 화면에서 버튼 찾아
  # 누르는 것 없이도 항상 최신 코드로 APK가 만들어지게 한다.
  push:
    branches: [main]
    # ⭐ 2026-11-08 — 화면(웹)만 고친 배포는 APK가 서비스 주소를 열어 바로 반영되므로 APK를 새로 만들지 않는다.
    #  (예전엔 main에 올릴 때마다 APK 번호가 올라가 기사앱에 "앱 업데이트가 있어요 [설치]"가 매번 떴다)
    #  안드로이드 네이티브·Capacitor 설정·플러그인(의존성)이 바뀔 때만 자동 빌드. 필요하면 Actions에서 "Run workflow"로 수동 빌드.
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "public/offline.html"
      - "package-lock.json"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: '빌드 타입'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ⭐ 아래 "릴리즈로 APK 게시" 단계가 릴리즈를 만들고 파일을 올리려면 필요하다.
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ⭐ 버그수정 — android-actions/setup-android@v3가 내부적으로 이미 단종된
      # "tools" 패키지를 설치하려다 실패한다(Google이 SDK 저장소에서 제거함).
      # cmdline-tools만 직접 받아서 라이선스를 수락해두고, platform/build-tools
      # 버전은 정확히 뭐가 필요한지 몰라도 되도록 Gradle(AGP)이 빌드 중에
      # 알아서 내려받게 둔다(네트워크 되는 GitHub 러너에서는 표준적으로 동작).
      - name: Android SDK 설정
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools"

      - name: npm 패키지 설치
        run: npm ci

      - name: 웹 앱 빌드
        run: npm run build

      # ⭐ 2026-11-05 기사 푸시(네이티브 FCM) — Firebase 콘솔에서 받은 google-services.json을 저장소 비밀값
      #  GOOGLE_SERVICES_JSON(파일 내용 그대로)에 넣어 두면 APK에 들어간다.
      #  비밀값이 없으면 푸시 플러그인을 빼고 빌드한다(google-services.json 없이 푸시 등록을 부르면 앱이 꺼질 수 있음).
      - name: google-services.json 준비(푸시)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json 저장 — 네이티브 푸시 포함"
          else
            echo "::warning::GOOGLE_SERVICES_JSON 비밀값이 없어 푸시 플러그인을 빼고 빌드합니다(기사 APK 푸시 미동작)."
            rm -rf node_modules/@capacitor/push-notifications
          fi

      - name: Capacitor Android 동기화
        run: npx cap sync android

      - name: Gradle 권한 설정
        run: chmod +x android/gradlew

      # ⭐ push 이벤트는 inputs가 없으므로 비어있으면 debug로 취급한다.
      - name: Debug APK 빌드
        if: ${{ (github.event.inputs.build_type || 'debug') == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Release APK 빌드
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Debug APK 업로드
        if: ${{ (github.event.inputs.build_type || 'debug') == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: KPFlow-기사앱-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK 업로드
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: KPFlow-기사앱-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      # ⭐ 사용자 요청 — GitHub Actions의 "Artifacts" 다운로드가 모바일 웹에서
      # 제대로 안 눌리는 경우가 있었다(버튼이 안 뜨거나 digest만 복사됨). 대신
      # "릴리즈"에 APK를 직접 첨부하면, 아무 브라우저에서나 되는 평범한 파일
      # 다운로드 링크가 생긴다. 태그를 고정해서(driver-apk-latest) 매번 같은
      # 링크를 북마크해두고 쓸 수 있게 한다.
      # ⭐ 2026-11-05 앱 안 "앱 업데이트가 있어요" 안내용 — 이번 APK의 versionCode(build.gradle과 같은 규칙: 실행번호+1)
      # ⭐ 2026-11-10 기사님이 다운로드 폴더에서 알아보기 쉽게 — LogisWeb-Driver.apk(영문: 릴리즈 파일 이름에 한글을 쓰면 깨질 수 있다)
      #  예전 이름(app-debug.apk)도 같이 올린다 — 이미 설치된 앱의 "앱 업데이트가 있어요" 주소가 예전 이름이라서
      - name: APK 이름 바꾸기(LogisWeb-Driver.apk)
        run: |
          SRC=$(ls android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null | head -1)
          mkdir -p android/app/build/outputs/named
          cp "$SRC" android/app/build/outputs/named/LogisWeb-Driver.apk
          ls -la android/app/build/outputs/named

      - name: APK 버전 정보(version.json)
        run: |
          VC=$(( GITHUB_RUN_NUMBER + 1 ))
          mkdir -p android/app/build/outputs
          echo "{\"versionCode\":$VC,\"versionName\":\"1.1.$GITHUB_RUN_NUMBER\",\"sha\":\"$GITHUB_SHA\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"apk\":\"https://github.com/$GITHUB_REPOSITORY/releases/download/driver-apk-latest/LogisWeb-Driver.apk\"}" > android/app/build/outputs/version.json
          echo "APK_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          cat android/app/build/outputs/version.json

      - name: 릴리즈로 APK 게시(모바일에서도 바로 다운로드되는 링크)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-apk-latest
          name: "KP-Flow 기사앱 (최신 빌드)"
          # ⭐ versionCode 줄은 기사앱이 GitHub API로 읽어 새 APK가 있는지 비교한다(지우지 말 것)
          body: |
            커밋 ${{ github.sha }} 기준 자동 빌드. 안드로이드 폰에서 LogisWeb-Driver.apk 를 눌러 다운로드한 뒤 설치하세요.
            versionCode: ${{ env.APK_VERSION_CODE }}
          files: |
            android/app/build/outputs/named/LogisWeb-Driver.apk
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/version.json
          prerelease: true
