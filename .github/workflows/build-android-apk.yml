name: Build Android APK

on:
  # ⭐ 사용자 요청 — workflow_dispatch(수동 "Run workflow" 버튼)를 이 세션에
  # 연결된 GitHub 앱이 API로 못 누른다(403, Actions 쓰기 권한 없음). main에
  # 푸시될 때마다 자동으로 빌드되게 해서, 모바일 GitHub 화면에서 버튼 찾아
  # 누르는 것 없이도 항상 최신 코드로 APK가 만들어지게 한다.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '빌드 타입'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ⭐ 아래 "릴리즈로 APK 게시" 단계가 릴리즈를 만들고 파일을 올리려면 필요하다.
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ⭐ 버그수정 — android-actions/setup-android@v3가 내부적으로 이미 단종된
      # "tools" 패키지를 설치하려다 실패한다(Google이 SDK 저장소에서 제거함).
      # cmdline-tools만 직접 받아서 라이선스를 수락해두고, platform/build-tools
      # 버전은 정확히 뭐가 필요한지 몰라도 되도록 Gradle(AGP)이 빌드 중에
      # 알아서 내려받게 둔다(네트워크 되는 GitHub 러너에서는 표준적으로 동작).
      - name: Android SDK 설정
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools"

      - name: npm 패키지 설치
        run: npm ci

      - name: 웹 앱 빌드
        run: npm run build

      - name: Capacitor Android 동기화
        run: npx cap sync android

      - name: Gradle 권한 설정
        run: chmod +x android/gradlew

      # ⭐ push 이벤트는 inputs가 없으므로 비어있으면 debug로 취급한다.
      - name: Debug APK 빌드
        if: ${{ (github.event.inputs.build_type || 'debug') == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Release APK 빌드
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Debug APK 업로드
        if: ${{ (github.event.inputs.build_type || 'debug') == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: KPFlow-기사앱-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK 업로드
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: KPFlow-기사앱-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      # ⭐ 사용자 요청 — GitHub Actions의 "Artifacts" 다운로드가 모바일 웹에서
      # 제대로 안 눌리는 경우가 있었다(버튼이 안 뜨거나 digest만 복사됨). 대신
      # "릴리즈"에 APK를 직접 첨부하면, 아무 브라우저에서나 되는 평범한 파일
      # 다운로드 링크가 생긴다. 태그를 고정해서(driver-apk-latest) 매번 같은
      # 링크를 북마크해두고 쓸 수 있게 한다.
      - name: 릴리즈로 APK 게시(모바일에서도 바로 다운로드되는 링크)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-apk-latest
          name: "KP-Flow 기사앱 (최신 빌드)"
          body: "커밋 ${{ github.sha }} 기준 자동 빌드. 안드로이드 폰에서 이 APK 파일을 눌러 다운로드한 뒤 설치하세요."
          files: android/app/build/outputs/apk/**/*.apk
          prerelease: true
