name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '빌드 타입'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ⭐ 버그수정 — android-actions/setup-android@v3가 내부적으로 이미 단종된
      # "tools" 패키지를 설치하려다 실패한다(Google이 SDK 저장소에서 제거함).
      # cmdline-tools만 직접 받아서 라이선스를 수락해두고, platform/build-tools
      # 버전은 정확히 뭐가 필요한지 몰라도 되도록 Gradle(AGP)이 빌드 중에
      # 알아서 내려받게 둔다(네트워크 되는 GitHub 러너에서는 표준적으로 동작).
      - name: Android SDK 설정
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools"

      - name: npm 패키지 설치
        run: npm ci

      - name: 웹 앱 빌드
        run: npm run build

      - name: Capacitor Android 동기화
        run: npx cap sync android

      - name: Gradle 권한 설정
        run: chmod +x android/gradlew

      - name: Debug APK 빌드
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Release APK 빌드
        if: ${{ inputs.build_type == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Debug APK 업로드
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: KPFlow-기사앱-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK 업로드
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: KPFlow-기사앱-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
